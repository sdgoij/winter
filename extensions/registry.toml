# The source of the registry Winter reads by default (ADR 088). Each extension
# lives unpackaged beside this file under its own id; the `pages` job runs
# `registry-publish`, which zips every directory and writes the real checksums
# into the published copy. The checksums here are placeholders.
#
# The schema, the caps and the rules are in `crates/registry/src/schema.rs`;
# `cargo test -p registry --test published` packages this tree into a temporary
# directory and checks the result.
