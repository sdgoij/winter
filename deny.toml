# cargo-deny policy.
#
# Permissive licences only, no unknown registries, no yanked crates. The
# workspace ships as a desktop binary, so a licence that forbids redistribution
# is disqualifying even when the crate is only linked.

[graph]
all-features = true
# Check the graphs CI actually builds. Without this, a dependency that only the
# Linux or macOS job resolves can pass on a Windows development host and fail in
# CI, which is the failure mode this gate exists to prevent.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# fontdue 0.9 pulls ttf-parser, which its author has marked unmaintained. It is
# not a vulnerability, and this rasteriser only parses fonts the user chose.
# Revisit when fontdue moves to skrifa or this rasteriser is replaced.
#
# The Linux accessibility path (eframe → accesskit → atspi → zbus 5) still uses
# the standalone zvariant and zbus_names crates, which were folded into zbus 6.
# They are unmaintained, not vulnerable, and are reachable on the Linux target
# only. Revisit when accesskit's atspi dependency moves to zbus 6.
ignore = [
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.9
# An allowance that the current graph does not use is expected: the list is a
# policy for the next dependency, not a description of today's.
unused-allowed-license = "allow"
# Every crate here says `publish = false`, so nothing is distributed as a crate.
private = { ignore = true }
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    # The fonts egui bundles. Both permit redistribution, which is all a
    # linked binary needs; the font itself is not modified.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
# A path dependency without a version is how the crates in this workspace refer
# to each other; they are never published, so there is no version to pin.
allow-wildcard-paths = true
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The extension engine is the one source outside crates.io, and `Cargo.toml`
# pins it to a revision that `Cargo.lock` records.
allow-git = ["https://github.com/sdgoij/slag"]
