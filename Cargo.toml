[workspace]
resolver = "3"
members = [
    "crates/utils",
    "crates/types",
    "crates/buffer",
    "crates/vt",
    "crates/adapter",
    "crates/term",
    "crates/renderer",
    "crates/host",
    "crates/server",
    "crates/settings",
    "crates/audio",
    "crates/icon",
    "crates/extensions",
    "crates/registry",
    "crates/winter",
    "crates/gtk4",
    "crates/cocoa",
    "crates/winui",
    "crates/demo",
    "crates/napi",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Winter contributors"]
publish = false

# The dependency ring, in the order it is allowed to point.
#
# `utils` sees nothing. `types` sees `utils`. `buffer` and `vt` see both and each
# other not at all. `adapter` sees all three. `renderer` sees `utils`, `types`
# and `buffer`, so `adapter` may later call into it. `host` sees `types`, `vt`
# and `adapter`: it consumes the parser and the console interfaces. `server`
# sits on `host` and exposes the console's API surface. `settings` is the
# user's TOML settings file and needs no workspace crate. `audio` is sound without a
# device and sees no workspace crate either (ADR 033). `extensions` is the
# extension loader and, behind its `host` feature, the Slag host; it sees no
# workspace crate, because a shell implements its `Host` trait and the core
# never learns that extensions exist. `registry` sits above `extensions` and
# owns the static registry schema and the rows a shell searches; it names no
# engine, no window and no network transport (ADR 088). `winter` is the
# shell-independent core: it sees everything and is the only crate allowed to
# (ADR 018). `gtk4`, `cocoa` and `winui` are the shells on top of it, one per
# platform, `demo` is the embedding demo's host, and `app` is the binary that
# selects between the shells (ADRs 080, 083).
# A crate that needs something from a crate to its right is a design error, not
# a manifest to edit; see docs/adr/001-workspace-layering.md.
[workspace.dependencies]
utils = { path = "crates/utils" }
types = { path = "crates/types" }
buffer = { path = "crates/buffer" }
vt = { path = "crates/vt" }
adapter = { path = "crates/adapter" }
term = { path = "crates/term" }
renderer = { path = "crates/renderer" }
host = { path = "crates/host" }
server = { path = "crates/server" }
settings = { path = "crates/settings" }
audio = { path = "crates/audio" }
extensions = { path = "crates/extensions" }
registry = { path = "crates/registry" }
winter = { path = "crates/winter" }

arboard = "3"
bitflags = "2"
embed-resource = "3"
toml = "1"
fontdue = "0.9"
libc = "0.2"
miniz_oxide = "0.9"
notify-rust = "4"
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
# The engine the extension host runs on. `docs/extensions-scope.md` records the
# choice; the revision is pinned and `Cargo.lock` is the lock, as for any git
# dependency.
slag = { git = "https://github.com/sdgoij/slag", rev = "1c916dd24bf3ee45683cc9522d5213ffce9f0cc4" }
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Pipes",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace.lints.rust]
# `utils` is the one crate that opts out, at its root, because it owns the
# lock-free primitives; `buffer`'s two iterator sites carry item-level allows
# with a SAFETY note. Everything else is denied, so a new `unsafe` is a review
# event rather than a silent addition.
unsafe_code = "deny"

[workspace.lints.clippy]
# Ratchet, not a resting place. Both lints are allowed because the ported code
# predates them (56 production call sites, almost all in `utils`); the target is
# `warn`, and the entry is deleted when the crate it names is clean. Do not add
# new call sites under the allowance.
unwrap_used = "allow"
expect_used = "allow"

[profile.test]
# MSVC refuses a program database larger than 4 GB (LNK1140). Line tables keep a
# panic's file and line; only variable inspection is traded away, and only for
# tests.
debug = 1
