[package]
name = "winterm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "The winterm terminal application"

[dependencies]
audio.workspace = true
buffer.workspace = true
eframe.workspace = true
host.workspace = true
renderer.workspace = true
server.workspace = true
settings.workspace = true
term.workspace = true
types.workspace = true
utils.workspace = true
arboard.workspace = true
notify-rust.workspace = true

# The GTK 4 shell's host toolkit; only built with the `gtk` feature (ADR 061).
gtk4 = { version = "0.11", optional = true, features = ["v4_6"] }

[features]
# The GTK 4 shell (ADR 061). Off by default while egui is still the Linux
# default and the gate must run without `gtk4-devel`.
gtk = ["dep:gtk4"]

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows-core = "0.100"
windows-reactor = { package = "windows-reactor-pre", version = "0.108" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
