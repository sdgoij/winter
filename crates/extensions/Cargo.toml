[package]
name = "extensions"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "Extensions: the manifest and discovery, and behind a feature the Slag host"

[dependencies]
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
semver.workspace = true
slag = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
# The half that runs code: one `slag::Context` per extension. Without this
# feature the crate is a loader and nothing links a JavaScript engine — or a
# JSON parser, since the manifest it reads is TOML.
host = ["dep:slag", "dep:serde_json"]

[dev-dependencies]
tempfile.workspace = true
# The wasm fixture's source is WAT; the tests compile it, so the ABI is checked
# against its source rather than against a binary nobody can read.
wat = "1"

[lints]
workspace = true
