[package]
name = "winter-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "A terminal the editor's own process owns, as a Node addon"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
server.workspace = true
types.workspace = true
winter.workspace = true
winter-demo = { path = "../demo" }

[build-dependencies]
napi-build = "2"

[lints]
workspace = true
