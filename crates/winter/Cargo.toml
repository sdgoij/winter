[package]
name = "winter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "The Winter terminal's shell-independent core"

[dependencies]
audio.workspace = true
buffer.workspace = true
host.workspace = true
renderer.workspace = true
server.workspace = true
settings.workspace = true
term.workspace = true
types.workspace = true
utils.workspace = true
notify-rust.workspace = true
# The drawn icon (ADR 058); dependency-free so the binary's build script can
# compile the same geometry.
winter-icon = { path = "../icon" }

[target.'cfg(windows)'.dependencies]
# The bell's Windows sink calls `Beep` directly (ADR 033).
windows-sys.workspace = true

[dev-dependencies]
# The `write-icon` example encodes the drawn icon as the PNG the Linux package
# installs (ADR 077). Only the example needs it, so the binary never links it.
png = "0.18"

[lints]
workspace = true
