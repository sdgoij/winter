[package]
name = "winter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "The Winter terminal application"

[dependencies]
audio.workspace = true
buffer.workspace = true
eframe.workspace = true
host.workspace = true
renderer.workspace = true
server.workspace = true
settings.workspace = true
term.workspace = true
types.workspace = true
utils.workspace = true
arboard.workspace = true
notify-rust.workspace = true

# The GTK 4 shell's host toolkit; only built with the `gtk` feature, which is
# parked (ADRs 061, 062).
gtk4 = { version = "0.11", optional = true, features = ["v4_8"] }

[features]
# The GTK 4 shell (ADRs 061, 062): parked, not shipped. Off by default; Linux
# runs the egui shell and the gate must build without `gtk4-devel`.
gtk = ["dep:gtk4"]

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS shell is AppKit, through the same objc2 crates eframe already uses on
# this host (ADR 072). Named only inside `src/macos/`.
objc2 = "0.6.5"
# Only the AppKit modules this shell names: the default feature set also pulls
# CloudKit, CoreData, CoreVideo and the rest of the bindings.
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSAlert",
    "NSAccessibilityConstants",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSBezierPath",
    "NSBitmapImageRep",
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSParagraphStyle",
    "NSPopUpButton",
    "NSResponder",
    "NSScreen",
    "NSScrollView",
    "NSClipView",
    "NSSearchField",
    "NSStringDrawing",
    "NSText",
    "NSTextContainer",
    "NSTextField",
    "NSTextInputClient",
    "NSTextView",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-foundation = "0.3.2"

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
windows-core = "0.100"
windows-numerics = "0.3.1"
windows-reactor = { package = "windows-reactor-pre", version = "0.108" }
windows = { version = "0.62", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource.workspace = true

[lints]
workspace = true
