name: Gate

# The gate every pipeline runs: the same `just gate` a contributor runs locally,
# on every platform the emulator claims to support. The parsing and buffer code
# is platform-independent, but the host and pty layers are not, and a
# Windows-only regression is the one a single-OS pipeline never catches.
#
# `ci.yml` calls this on every push and pull request; `release.yml` calls it
# before it packages anything, so a red gate means no release rather than a
# partial one. Both callers run this file, so the gate cannot drift between them.
on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `macos-15-intel` is the Intel image on purpose, and it is the label
        # GitHub offers for public repositories: `macos-latest` is arm64 and
        # overruns its capacity, and a job that never starts is not a gate. The
        # point of the matrix is a second host, not a second queue.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      # `rustup show` reads rust-toolchain.toml, so the pin in the repository is
      # the toolchain CI uses; there is no second version to keep in sync.
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
        with:
          just-version: "1.59.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Run the gate
        run: just gate
