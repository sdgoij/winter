name: CI

# One pipeline, one file. The gate runs on every push, pull request and tag; a
# tag with a `v` prefix additionally packages a binary per platform and
# publishes them. Keeping the release jobs in the same file means the gate a tag
# runs is literally the gate a pull request runs, so the two cannot drift.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A pull request supersedes its own earlier runs. A tag's release must not be
  # cancelled half-uploaded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  # The gate is the same `just gate` a contributor runs locally, on every
  # platform the emulator claims to support. The parsing and buffer code is
  # platform-independent, but the host and pty layers are not, and a
  # Windows-only regression is the one a single-OS pipeline never catches.
  gate:
    name: Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `macos-15-intel` is the Intel image on purpose, and it is the label
        # GitHub offers for public repositories: `macos-latest` is arm64 and
        # overruns its capacity, and a job that never starts is not a gate. The
        # point of the matrix is a second host, not a second queue.
        #
        # Two Linux architectures: the release ships both, and an archive is
        # built on the host that tested it, so arm64 is a gate of its own.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      # `rustup show` reads rust-toolchain.toml, so the pin in the repository is
      # the toolchain CI uses; there is no second version to keep in sync.
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
        with:
          just-version: "1.59.0"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Run the gate
        run: just gate

  # Everything below is a release, and a release is a tag. `if` on every job
  # keeps a push to `main` from spending four more runners.
  #
  # Fails before those runners are spent: the archives are named after the
  # version, and the release is the tag, so the two disagreeing would publish
  # files a user cannot match to a release.
  preflight:
    name: Check the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: The tag names the version in Cargo.toml
        run: |
          set -eu
          version=$(awk '/^\[workspace.package\]/ { found = 1 } found && /^version *=/ { gsub(/[^0-9.]/, "", $3); print $3; exit }' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::no version under [workspace.package] in Cargo.toml"
            exit 1
          fi
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not name Cargo.toml's version v$version"
            exit 1
          fi

  package:
    name: Package (${{ matrix.os }})
    needs: [preflight, gate]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The same hosts the gate ran on, so an archive is made by the platform
        # that tested it. `macos-15-intel` is the Intel image GitHub offers for
        # public repositories; Apple Silicon runs the result under Rosetta.
        # Linux is built for both architectures, natively.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      # `rustup show` reads rust-toolchain.toml, so the archive is built with
      # the pinned toolchain.
      - name: Install the pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
        with:
          just-version: "1.59.0"
      # `just package` names the archive after the version in Cargo.toml and the
      # target it built for (scripts/package.sh).
      #
      # Windows packaging copies OpenConsole.exe from the installed Windows
      # Terminal (scripts/console-host.ps1, ADR 055), which the runner image
      # carries; without it the archive would lose image support silently.
      - name: Build and package
        run: just package
      - uses: actions/upload-artifact@v4
        with:
          name: winterm-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that needs to write, and the only one that gets to.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          (cd assets && sha256sum winterm-* > SHA256SUMS)
          prerelease=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease="--prerelease" ;;
          esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run after a partial upload replaces the assets instead of
            # failing on the release that already exists.
            gh release upload "$GITHUB_REF_NAME" assets/* --clobber
          else
            # shellcheck disable=SC2086 # the flag is deliberately word-split
            gh release create "$GITHUB_REF_NAME" assets/* \
              --title "winterm ${GITHUB_REF_NAME#v}" \
              --generate-notes $prerelease
          fi
