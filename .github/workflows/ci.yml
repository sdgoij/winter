name: CI

# The gate, on every platform, for every push and pull request. The jobs live in
# `gate.yml`, which `release.yml` calls too, so the two cannot disagree about
# what "passing" means.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
